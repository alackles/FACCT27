<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reply network</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --hairline: #e1e0d9;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #6250d6;
  --other: #b4b2a9;
  --hub-other: #6f6e69;
  --edge: #52514e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --other: #5c5b56;
    --hub-other: #a3a19a;
    --edge: #c3c2b7;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --hairline: #2c2c2a;
  --border: rgba(255,255,255,0.10);
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #008300;
  --series-7: #9085e9;
  --other: #5c5b56;
  --hub-other: #a3a19a;
  --edge: #c3c2b7;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--page); color: var(--ink);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column;
}
header {
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  padding: 10px 16px; border-bottom: 1px solid var(--hairline);
}
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
header .summary { color: var(--ink-2); font-variant-numeric: tabular-nums; }
header .controls { margin-left: auto; display: flex; gap: 8px; }
input, button, select {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px;
}
button, select { cursor: pointer; }
button:hover { background: var(--hairline); }
button:disabled { color: var(--muted); cursor: default; background: var(--surface); }
.months { display: flex; gap: 4px; align-items: center; }
.months[hidden] { display: none; }
.months select { font-variant-numeric: tabular-nums; }
.note { color: var(--ink-2); margin: 6px 0 0; }
main { flex: 1; display: flex; min-height: 0; }
#stage { flex: 1; position: relative; background: var(--surface); min-width: 0; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; }
#tip {
  position: absolute; pointer-events: none; display: none;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); white-space: nowrap;
}
#tip strong { font-variant-numeric: tabular-nums; }
#tip span { color: var(--ink-2); }
#status { position: absolute; left: 12px; bottom: 10px; color: var(--muted); }
aside {
  width: 320px; overflow-y: auto; border-left: 1px solid var(--hairline);
  padding: 12px 16px; background: var(--page);
}
aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
           color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
aside h2:first-child { margin-top: 0; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
dt { color: var(--ink-2); }
dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
.empty { color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; }
.list button {
  width: 100%; display: flex; align-items: center; gap: 8px; text-align: left;
  border: 0; border-radius: 4px; background: transparent; padding: 3px 6px;
}
.list button:hover, .list button[aria-pressed="true"] { background: var(--hairline); }
.list .n { margin-left: auto; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.ring { width: 10px; height: 10px; border-radius: 50%; flex: none;
        border: 1.5px solid var(--ink); }
.key { display: flex; flex-direction: column; gap: 4px; color: var(--ink-2); }
.key div { display: flex; align-items: center; gap: 8px; }
#clusters { max-height: 260px; overflow-y: auto; }
@media (max-width: 760px) {
  main { flex-direction: column; }
  #stage { min-height: 60vh; }
  aside { width: auto; border-left: 0; border-top: 1px solid var(--hairline); }
  header .controls { margin-left: 0; }
}
</style>
</head>
<body>
<header>
  <h1 id="title">Reply network</h1>
  <span class="summary" id="summary"></span>
  <div class="controls">
    <div class="months" id="months" hidden>
      <button id="prev" aria-label="Previous month" title="Previous (←)">‹</button>
      <select id="month" aria-label="Month"></select>
      <button id="next" aria-label="Next month" title="Next (→)">›</button>
    </div>
    <input id="search" list="ids" placeholder="Find C…" aria-label="Find a node by pseudonym" size="10">
    <datalist id="ids"></datalist>
    <button id="clear">Clear selection</button>
    <button id="reset">Reset view</button>
  </div>
</header>
<main>
  <div id="stage">
    <canvas id="canvas" aria-label="Force-directed reply network; use the lists at right for keyboard access"></canvas>
    <div id="tip"></div>
    <div id="status">Laying out…</div>
  </div>
  <aside>
    <h2>Selected</h2>
    <div id="card"><p class="empty">Click a node, a cluster, or a name below.</p></div>
    <h2>Key</h2>
    <div class="key" id="key">
      <div><span class="swatch" style="background:var(--series-1)"></span>Cluster 1 (largest)</div>
      <div><span class="swatch" style="background:var(--series-2)"></span>Cluster 2</div>
      <div><span class="swatch" style="background:var(--series-3)"></span>Cluster 3</div>
      <div><span class="swatch" style="background:var(--other)"></span>All other clusters</div>
      <div><span class="ring"></span>Moderator</div>
      <div>Size = number of connections</div>
    </div>
    <h2 id="tracked-title" hidden></h2>
    <ul class="list" id="tracked" hidden></ul>
    <h2 id="groups-title">Clusters (Louvain)</h2>
    <ul class="list" id="clusters"></ul>
    <h2>Most connected</h2>
    <ul class="list" id="top"></ul>
  </aside>
</main>
<script id="data" type="application/json">__DATA__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const data = JSON.parse(document.getElementById("data").textContent);
const nodes = data.nodes.map((d, i) => ({ ...d, index: i }));
const links = data.links.map(([s, t, w]) => ({ source: s, target: t, w }));
const hubMode = data.meta.mode === "hubs";  // groups are Kirkley hubs, not clusters
const clusterSize = new Map((data.clusters || []).map(c => [c.id, c.size]));
const byId = new Map(nodes.map(n => [n.id, n]));

// Views: the whole period, then (with --months) one per calendar month. Every view
// uses the same nodes and positions; a month says which people and ties were active,
// their counts that month, and that month's hubs. Built on first visit.
function neighborSets(linkIndices) {
  const nb = nodes.map(() => new Set());
  for (const i of linkIndices) { const [s, t] = data.links[i]; nb[s].add(t); nb[t].add(s); }
  return nb;
}
const months = data.months || [];
const views = [{ label: "Whole period", hubs: data.hubs || [], total: data.meta.in_degree_total,
                 nodeOn: null, linkOn: null, stats: null, nLinks: links.length,
                 neighbors: neighborSets(links.keys()), ranked: nodes.map(n => n.index) }];
function view(i) {
  if (i === 0 || views[i]) return views[i];
  const m = months[i - 1];
  const stats = new Map(m.nodes.map(([j, degree, contexts, replied_by, replied_to, mod]) =>
    [j, { degree, contexts, replied_by, replied_to, mod: !!mod }]));
  const linkOn = new Uint8Array(links.length);
  for (const [li] of m.links) linkOn[li] = 1;
  return views[i] = {
    label: m.label, hubs: m.hubs, total: m.in_degree_total, stats, linkOn,
    nodeOn: new Set(stats.keys()), nLinks: m.links.length,
    neighbors: neighborSets(m.links.map(([li]) => li)),
    ranked: [...stats.keys()].sort((a, b) => stats.get(b).degree - stats.get(a).degree || a - b),
  };
}
let viewIndex = 0;
let V = view(0);
let hubs = V.hubs;
let hubIds = new Set(hubs.map(h => h.id));
const on = n => !V.nodeOn || V.nodeOn.has(n.index);   // active in the current view
const st = n => V.stats ? V.stats.get(n.index) : n;    // its counts there (undefined if not)

// Size is whole-period connections in every view, so marks don't change size between
// months: a month changes what is lit, not the picture underneath.
const maxDeg = d3.max(nodes, n => n.degree) || 1;
const radius = d3.scaleSqrt().domain([1, maxDeg]).range([2.5, 16]);
nodes.forEach(n => { n.r = radius(Math.max(1, n.degree)); });

let selected = null;      // node index
let selectedCluster = null;
let selectedHub = null;   // position in hubs
let followHub = null;     // id of the hub last chosen; followed from month to month
let hubMembers = new Set();  // the selected hub and the people who replied to it
let transform = d3.zoomIdentity;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const tip = document.getElementById("tip");
let width = 0, height = 0;

// Tracked hubs (--track): the first K people to become hubs, each with a fixed color in
// every view. Filled = a hub in this view; a ring in their color = active, not a hub;
// other hubs of this view are filled dark grey. Hubs stay marked without a click, and
// a click focuses by fading everyone else, so colors keep meaning who someone is.
const tracked = data.tracked || [];
const slot = new Map(tracked.map((t, i) => [t.id, i + 1]));
const tracking = tracked.length > 0;
const hollow = n => tracking && slot.has(n.id) && !hubIds.has(n.id);

function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function fill(n, c) {
  if (tracking) return slot.has(n.id) ? c["series-" + slot.get(n.id)]
                     : hubIds.has(n.id) ? c["hub-other"] : c.other;
  if (hubMode) return hubMembers.has(n.index) ? c["series-1"] : c.other;
  return n.cluster <= 3 ? c["series-" + n.cluster] : c.other;
}
function active(n) {
  if (!on(n)) return false;
  if (selected !== null) return n.index === selected || V.neighbors[selected].has(n.index);
  if (selectedHub !== null) return hubMembers.has(n.index);
  if (selectedCluster !== null) return n.cluster === selectedCluster;
  return true;
}

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  width = rect.width; height = rect.height;
  canvas.width = width * dpr; canvas.height = height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function draw() {
  const c = { surface: css("--surface"), ink: css("--ink"), edge: css("--edge"), other: css("--other"),
              "hub-other": css("--hub-other") };
  for (let k = 1; k <= 7; k++) c["series-" + k] = css("--series-" + k);
  const focus = selected !== null || selectedCluster !== null || selectedHub !== null;
  const hubNode = selectedHub !== null ? byId.get(hubs[selectedHub].id).index : null;
  ctx.save();
  ctx.clearRect(0, 0, width, height);
  ctx.translate(transform.x, transform.y);
  ctx.scale(transform.k, transform.k);

  ctx.lineWidth = 0.6 / transform.k;
  ctx.strokeStyle = c.edge;
  ctx.globalAlpha = focus ? 0.04 : 0.10;
  ctx.beginPath();
  links.forEach((l, i) => {  // ties not active in this view aren't drawn at all
    if (V.linkOn && !V.linkOn[i]) return;
    if (focus && active(l.source) && active(l.target)) return;
    ctx.moveTo(l.source.x, l.source.y); ctx.lineTo(l.target.x, l.target.y);
  });
  ctx.stroke();
  if (focus) {
    ctx.globalAlpha = 0.45;
    ctx.beginPath();
    for (const [i, l] of links.entries()) {
      if (V.linkOn && !V.linkOn[i]) continue;
      if (!(active(l.source) && active(l.target))) continue;
      if (selected !== null && l.source.index !== selected && l.target.index !== selected) continue;
      if (hubNode !== null && l.source.index !== hubNode && l.target.index !== hubNode) continue;
      ctx.moveTo(l.source.x, l.source.y); ctx.lineTo(l.target.x, l.target.y);
    }
    ctx.stroke();
  }

  // Small nodes first so hubs sit on top (and, when tracking, hubs and tracked people
  // after everyone else); each wears a surface ring. Radii are in screen pixels, so
  // zooming in spreads a dense region apart.
  const marked = n => tracking && (slot.has(n.id) || hubIds.has(n.id));
  const order = [];
  for (let i = nodes.length - 1; i >= 0; i--) if (!marked(nodes[i])) order.push(nodes[i]);
  for (let i = nodes.length - 1; i >= 0; i--) if (marked(nodes[i])) order.push(nodes[i]);
  for (const n of order) {
    const faint = tracking && slot.has(n.id) ? 0.3 : 0.05;  // tracked stay findable when absent
    ctx.globalAlpha = active(n) ? 1 : on(n) ? 0.12 : faint;
    ctx.beginPath();
    if (hollow(n)) {  // tracked, not a hub in this view: a ring in their color
      ctx.arc(n.x, n.y, Math.max(n.r, 5) / transform.k, 0, 2 * Math.PI);
      ctx.fillStyle = c.surface;
      ctx.fill();
      ctx.lineWidth = 2.5 / transform.k;
      ctx.strokeStyle = fill(n, c);
      ctx.stroke();
    } else {
      ctx.arc(n.x, n.y, n.r / transform.k, 0, 2 * Math.PI);
      ctx.fillStyle = fill(n, c);
      ctx.fill();
      ctx.lineWidth = 1 / transform.k;
      ctx.strokeStyle = c.surface;
      ctx.stroke();
    }
    if ((st(n) || n).mod) {  // in a month: moderator-distinguished activity that month
      ctx.beginPath();
      ctx.arc(n.x, n.y, ((hollow(n) ? Math.max(n.r, 5) : n.r) + 2.5) / transform.k, 0, 2 * Math.PI);
      ctx.lineWidth = 1.5 / transform.k;
      ctx.strokeStyle = c.ink;
      ctx.stroke();
    }
  }

  ctx.globalAlpha = 1;
  ctx.fillStyle = c.ink;
  ctx.font = `${12 / transform.k}px system-ui, -apple-system, "Segoe UI", sans-serif`;
  const show = new Set(V.ranked.slice(0, 5));
  if (selected !== null) show.add(selected);
  if (hubNode !== null) show.add(hubNode);
  for (const t of tracked) show.add(byId.get(t.id).index);  // identity never rests on color alone
  for (const i of show) {
    const n = nodes[i];
    const keep = i === selected || slot.has(n.id);  // the selection and tracked keep labels
    if (!active(n) && !keep) continue;
    ctx.globalAlpha = active(n) ? 1 : 0.45;
    const r = hollow(n) ? Math.max(n.r, 5) : n.r;
    ctx.fillText(n.id, n.x + (r + 4) / transform.k, n.y + 4 / transform.k);
  }
  ctx.restore();
}

function nodeAt(event) {
  const [mx, my] = d3.pointer(event, canvas);
  const [x, y] = transform.invert([mx, my]);
  let best = null, bestD = Infinity;
  for (const n of nodes) {
    const d = Math.hypot(n.x - x, n.y - y) * transform.k - n.r;  // screen px past the mark
    if (d < bestD) { bestD = d; best = n; }
  }
  return bestD <= 10 ? best : null;  // 10px of slack beyond the mark
}

function row(dl, label, value) {
  const dt = document.createElement("dt"); dt.textContent = label;
  const dd = document.createElement("dd"); dd.textContent = value;
  dl.append(dt, dd);
}

function showCard() {
  const card = document.getElementById("card");
  card.replaceChildren();
  const when = viewIndex ? ` (${V.label})` : "";
  if (selected !== null) {
    const n = nodes[selected], s = st(n);
    const h = document.createElement("p");
    h.style.margin = "0 0 6px"; h.style.fontWeight = "600"; h.textContent = n.id;
    card.append(h);
    if (followHub === n.id && !hubIds.has(n.id)) {
      const p = document.createElement("p"); p.className = "note";
      p.textContent = `Not a Kirkley ${data.meta.encoding} hub${when}; showing everyone they're tied to.`;
      card.append(p);
    }
    if (!s) {
      const p = document.createElement("p"); p.className = "empty";
      p.textContent = `No kept replies to or from them in ${V.label}.`;
      card.append(p);
    } else {
      const dl = document.createElement("dl");
      row(dl, `Connections (people)${when}`, s.degree.toLocaleString());
      row(dl, `Replied to by (people)${when}`, s.replied_by.toLocaleString());
      row(dl, `Replied to (people)${when}`, s.replied_to.toLocaleString());
      row(dl, `Thread contexts${when}`, s.contexts.toLocaleString());
      if (hubMode) row(dl, `Kirkley ${data.meta.encoding} hub${when}`, hubIds.has(n.id) ? "yes" : "no");
      else row(dl, "Cluster", `${n.cluster} (${clusterSize.get(n.cluster).toLocaleString()} people)`);
      row(dl, `Moderator${when}`, s.mod ? "yes" : "no");
      card.append(dl);
    }
  } else if (selectedHub !== null) {
    const hub = hubs[selectedHub];
    const h = document.createElement("p");
    h.style.margin = "0 0 6px"; h.style.fontWeight = "600"; h.textContent = hub.id;
    const dl = document.createElement("dl");
    row(dl, `${data.meta.encoding} hub rank${when}`, `${selectedHub + 1} of ${hubs.length}`);
    row(dl, "In-degree (thread contexts)", hub.in_degree.toLocaleString());
    row(dl, "Share of all in-degree", `${(100 * hub.in_degree / V.total).toFixed(1)}%`);
    row(dl, "Replied to by (people)", hub.repliers.toLocaleString());
    row(dl, "Moderator", st(byId.get(hub.id)).mod ? "yes" : "no");
    card.append(h, dl);
  } else if (selectedCluster !== null) {
    const members = nodes.filter(n => n.cluster === selectedCluster);
    const dl = document.createElement("dl");
    row(dl, "Cluster", String(selectedCluster));
    row(dl, "People", members.length.toLocaleString());
    row(dl, "Moderators", members.filter(n => n.mod).length.toLocaleString());
    row(dl, "Most connected", members[0].id);
    card.append(dl);
  } else {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = hubMode ? "Click a hub below, or a node." : "Click a node, a cluster, or a name below.";
    card.append(p);
  }
  for (const b of document.querySelectorAll("#clusters button[data-hub]"))
    b.setAttribute("aria-pressed", String(Number(b.dataset.hub) === selectedHub));
  for (const b of document.querySelectorAll("#clusters button[data-id]"))
    b.setAttribute("aria-pressed", String(Number(b.dataset.id) === selectedCluster));
}

function clearHub() { selectedHub = null; hubMembers = new Set(); }
function select(i) { selected = i; selectedCluster = null; followHub = null; clearHub(); showCard(); draw(); }
function selectCluster(id) { selectedCluster = id; selected = null; followHub = null; clearHub(); showCard(); draw(); }
function selectHub(i) {
  selected = null; selectedCluster = null;
  if (i === null) { clearHub(); followHub = null; }
  else { selectedHub = i; hubMembers = new Set(hubs[i].members); followHub = hubs[i].id; }
  showCard(); draw();
}

// Switch view, keeping the selection. A chosen hub is followed by id: where it is a
// hub that month its repliers are lit; where it isn't, it is shown as a plain
// selection (everyone it's tied to that month) until it is a hub again.
function setView(i) {
  const keep = followHub;
  viewIndex = i; V = view(i);
  hubs = V.hubs; hubIds = new Set(hubs.map(h => h.id));
  clearHub();
  if (keep !== null) {
    const j = hubs.findIndex(h => h.id === keep);
    if (j >= 0) { selected = null; selectedHub = j; hubMembers = new Set(hubs[j].members); }
    else selected = byId.get(keep).index;
  }
  monthSelect.value = String(i);
  document.getElementById("prev").disabled = i === 0;
  document.getElementById("next").disabled = i === months.length;
  renderLists(); summarize(); showCard(); draw();
}

function centerOn(n) {
  userMoved = true;
  const k = Math.max(transform.k, 1.5);
  d3.select(canvas).call(zoom.transform,
    d3.zoomIdentity.translate(width / 2 - n.x * k, height / 2 - n.y * k).scale(k));
}

function fit() {
  if (!width) return;
  const xs = d3.extent(nodes, n => n.x), ys = d3.extent(nodes, n => n.y);
  const k = 0.9 * Math.min(width / (xs[1] - xs[0] || 1), height / (ys[1] - ys[0] || 1));
  const t = d3.zoomIdentity.translate(width / 2 - k * (xs[0] + xs[1]) / 2,
                                      height / 2 - k * (ys[0] + ys[1]) / 2).scale(k);
  d3.select(canvas).call(zoom.transform, t);
}

// Lists: the keyboard and table route to everything the canvas shows.
const colorVar = id => id <= 3 ? `var(--series-${id})` : "var(--other)";
const clusterList = document.getElementById("clusters");
const topList = document.getElementById("top");
function swatch(node, fallback) {  // a list swatch drawn the way the node is drawn
  const sw = document.createElement("span");
  const s = st(node);
  sw.className = s && s.mod ? "swatch ring" : "swatch";
  if (!tracking) { sw.style.background = fallback; return sw; }
  const color = slot.has(node.id) ? `var(--series-${slot.get(node.id)})`
              : hubIds.has(node.id) ? "var(--hub-other)" : "var(--other)";
  if (hollow(node)) { sw.className = "swatch"; sw.style.border = `2.5px solid ${color}`; }
  else sw.style.background = color;
  return sw;
}
const trackedList = document.getElementById("tracked");
function renderLists() {  // tracked, hub list and "most connected", for the current view
  if (tracking) {
    const title = document.getElementById("tracked-title");
    title.hidden = trackedList.hidden = false;
    title.textContent = `First ${tracked.length} ${data.meta.encoding} hubs (tracked)`;
    trackedList.replaceChildren();
    for (const t of tracked) {
      const node = byId.get(t.id);
      const li = document.createElement("li");
      const b = document.createElement("button");
      const name = document.createElement("span"); name.textContent = t.id;
      const first = document.createElement("span"); first.className = "empty";
      first.textContent = `first ${t.first}`;
      const n = document.createElement("span"); n.className = "n";
      n.textContent = hubIds.has(t.id) ? "hub" : on(node) ? "active" : "absent";
      b.append(swatch(node), name, first, n);
      b.addEventListener("click", () => {
        const j = hubs.findIndex(h => h.id === t.id);
        if (j >= 0) selectHub(j); else { select(node.index); followHub = t.id; showCard(); }
        centerOn(node);
      });
      li.append(b); trackedList.append(li);
    }
  }
  if (hubMode) {
    clusterList.replaceChildren();
    hubs.forEach((hub, i) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.dataset.hub = i;
      const sw = swatch(byId.get(hub.id), "var(--series-1)");
      const name = document.createElement("span"); name.textContent = hub.id;
      const n = document.createElement("span"); n.className = "n"; n.textContent = hub.in_degree.toLocaleString();
      b.append(sw, name, n);
      b.addEventListener("click", () => selectHub(selectedHub === i ? null : i));
      li.append(b); clusterList.append(li);
    });
    document.getElementById("groups-title").textContent =
      `Hubs (Kirkley ${data.meta.encoding}, in-degree) · ${hubs.length}`;
  }
  topList.replaceChildren();
  for (const i of V.ranked.slice(0, 25)) {
    const node = nodes[i], s = st(node);
    const li = document.createElement("li");
    const b = document.createElement("button");
    const sw = swatch(node, hubMode ? "var(--other)" : colorVar(node.cluster));
    const name = document.createElement("span"); name.textContent = node.id;
    const n = document.createElement("span"); n.className = "n"; n.textContent = s.degree.toLocaleString();
    b.append(sw, name, n);
    b.addEventListener("click", () => { select(node.index); centerOn(node); });
    li.append(b); topList.append(li);
  }
}
for (const cl of data.clusters || []) {
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.dataset.id = cl.id;
  const sw = document.createElement("span"); sw.className = "swatch"; sw.style.background = colorVar(cl.id);
  const name = document.createElement("span"); name.textContent = `Cluster ${cl.id}`;
  const n = document.createElement("span"); n.className = "n"; n.textContent = cl.size.toLocaleString();
  b.append(sw, name, n);
  b.addEventListener("click", () => selectCluster(selectedCluster === cl.id ? null : cl.id));
  li.append(b); clusterList.append(li);
}
const datalist = document.getElementById("ids");
for (const node of nodes) { const o = document.createElement("option"); o.value = node.id; datalist.append(o); }

function summarize() {
  const people = V.nodeOn ? `${V.nodeOn.size.toLocaleString()} of ${nodes.length.toLocaleString()} people`
                          : `${nodes.length.toLocaleString()} people`;
  document.getElementById("summary").textContent =
    `${people} · ${V.nLinks.toLocaleString()} ties · ` +
    (hubMode ? `${hubs.length.toLocaleString()} ${data.meta.encoding} hubs`
             : `${data.clusters.length.toLocaleString()} clusters`) + ` · weight: ${data.meta.weight}` +
    (viewIndex ? ` · month: ${V.label} (UTC)` : "");
}
renderLists();
summarize();
if (hubMode) {
  document.title = `Reply network: Kirkley ${data.meta.encoding} hubs` + (months.length ? " by month" : "");
  document.getElementById("title").textContent = document.title;
  const enc = data.meta.encoding;
  document.getElementById("key").innerHTML = (tracking
    ? '<div><span class="swatch" style="background:var(--series-1)"></span>Tracked (list below), ' + enc + ' hub this month</div>' +
      '<div><span class="swatch" style="border:2.5px solid var(--series-1)"></span>Tracked, active but not a hub this month</div>' +
      '<div><span class="swatch" style="background:var(--hub-other)"></span>Other ' + enc + ' hub this month</div>' +
      '<div>Click a hub: it and its repliers stay, everyone else fades</div>'
    : '<div><span class="swatch" style="background:var(--series-1)"></span>Selected hub and the people who replied to it</div>') +
    '<div><span class="swatch" style="background:var(--other)"></span>Everyone else</div>' +
    (months.length ? '<div><span class="swatch" style="background:var(--other);opacity:0.3"></span>Faint = no kept replies that month</div>' : '') +
    '<div><span class="ring"></span>Moderator' + (months.length ? ' (in a month: acted as one that month)' : '') + '</div>' +
    '<div>Size = number of connections' + (months.length ? ', whole period (fixed across months)' : '') + '</div>' +
    '<div>Numbers in the hub list = in-degree (thread contexts)</div>';
  showCard();
}

// Month selector: positions never change, so stepping months compares like with like.
const monthSelect = document.getElementById("month");
if (months.length) {
  document.getElementById("months").hidden = false;
  ["Whole period", ...months.map(m => m.label)].forEach((label, i) => {
    const o = document.createElement("option"); o.value = String(i); o.textContent = label;
    monthSelect.append(o);
  });
  monthSelect.addEventListener("change", () => setView(Number(monthSelect.value)));
  document.getElementById("prev").addEventListener("click", () => viewIndex > 0 && setView(viewIndex - 1));
  document.getElementById("next").addEventListener("click", () => viewIndex < months.length && setView(viewIndex + 1));
  document.getElementById("prev").disabled = true;
  document.addEventListener("keydown", e => {
    if (["INPUT", "SELECT"].includes(e.target.tagName)) return;
    if (e.key === "ArrowLeft" && viewIndex > 0) setView(viewIndex - 1);
    if (e.key === "ArrowRight" && viewIndex < months.length) setView(viewIndex + 1);
  });
}
// Time window, if one was given: shown in the summary, and leading the tab title so
// month-by-month files can be told apart.
if (data.meta.start != null || data.meta.end != null) {
  const day = t => t == null ? "…" : new Date(t * 1000).toISOString().slice(0, 10);
  document.getElementById("summary").textContent +=
    ` · window: ${day(data.meta.start)} to ${day(data.meta.end)} (end exclusive)`;
  document.title = `${day(data.meta.start)} · ${document.title}`;
}

document.getElementById("search").addEventListener("change", e => {
  const n = byId.get(e.target.value.trim());
  if (n) { select(n.index); centerOn(n); }
});
document.getElementById("clear").addEventListener("click", () => { selected = null; selectedCluster = null; followHub = null; clearHub(); showCard(); draw(); });
document.getElementById("reset").addEventListener("click", () => { userMoved = false; fit(); });

const zoom = d3.zoom().scaleExtent([0.02, 40]).on("zoom", e => {
  transform = e.transform;
  if (e.sourceEvent) userMoved = true;
  draw();
});
d3.select(canvas).call(zoom).on("dblclick.zoom", null);

canvas.addEventListener("click", e => {
  const n = nodeAt(e);
  if (n) select(selected === n.index ? null : n.index);
});
canvas.addEventListener("pointermove", e => {
  const n = nodeAt(e);
  if (!n) { tip.style.display = "none"; return; }
  tip.replaceChildren();
  const c = st(n);
  const v = document.createElement("strong"); v.textContent = c ? c.degree.toLocaleString() : "no";
  const group = hubMode ? (hubIds.has(n.id) ? ` · ${data.meta.encoding} hub` : "") : ` · cluster ${n.cluster}`;
  const s = document.createElement("span");
  s.textContent = ` connections${viewIndex ? " in " + V.label : ""} · ${n.id}${group}${c && c.mod ? " · mod" : ""}`;
  tip.append(v, s);
  const [mx, my] = d3.pointer(e, canvas);
  tip.style.left = `${mx + 14}px`; tip.style.top = `${my + 14}px`;
  tip.style.display = "block";
});
canvas.addEventListener("pointerleave", () => { tip.style.display = "none"; });

// Layout runs in chunks of ticks between frames, so the page stays responsive and
// the view keeps itself fitted until the reader zooms or pans.
const status = document.getElementById("status");
const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).distance(30))
  .force("charge", d3.forceManyBody().strength(-30).distanceMax(600))
  .force("x", d3.forceX().strength(0.03))
  .force("y", d3.forceY().strength(0.03))
  .alphaDecay(0.03)
  .stop();
let userMoved = false;
function step() {
  for (let i = 0; i < 10 && sim.alpha() > sim.alphaMin(); i++) sim.tick();
  if (!userMoved) fit(); else draw();
  if (sim.alpha() > sim.alphaMin()) setTimeout(step, 0);
  else {
    status.textContent = "Layout settled. Scroll to zoom, drag to pan, click a node.";
    const n = byId.get(decodeURIComponent(location.hash.slice(1)));  // e.g. network.html#C12
    if (n) select(n.index);
  }
}

new ResizeObserver(resize).observe(document.getElementById("stage"));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
setTimeout(step, 0);
</script>
</body>
</html>
