<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reply network</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --hairline: #e1e0d9;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --other: #b4b2a9;
  --edge: #52514e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --other: #5c5b56;
    --edge: #c3c2b7;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --hairline: #2c2c2a;
  --border: rgba(255,255,255,0.10);
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --other: #5c5b56;
  --edge: #c3c2b7;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--page); color: var(--ink);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column;
}
header {
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  padding: 10px 16px; border-bottom: 1px solid var(--hairline);
}
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
header .summary { color: var(--ink-2); font-variant-numeric: tabular-nums; }
header .controls { margin-left: auto; display: flex; gap: 8px; }
input, button {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px;
}
button { cursor: pointer; }
button:hover { background: var(--hairline); }
main { flex: 1; display: flex; min-height: 0; }
#stage { flex: 1; position: relative; background: var(--surface); min-width: 0; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; }
#tip {
  position: absolute; pointer-events: none; display: none;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); white-space: nowrap;
}
#tip strong { font-variant-numeric: tabular-nums; }
#tip span { color: var(--ink-2); }
#status { position: absolute; left: 12px; bottom: 10px; color: var(--muted); }
aside {
  width: 320px; overflow-y: auto; border-left: 1px solid var(--hairline);
  padding: 12px 16px; background: var(--page);
}
aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
           color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
aside h2:first-child { margin-top: 0; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
dt { color: var(--ink-2); }
dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
.empty { color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; }
.list button {
  width: 100%; display: flex; align-items: center; gap: 8px; text-align: left;
  border: 0; border-radius: 4px; background: transparent; padding: 3px 6px;
}
.list button:hover, .list button[aria-pressed="true"] { background: var(--hairline); }
.list .n { margin-left: auto; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.ring { width: 10px; height: 10px; border-radius: 50%; flex: none;
        border: 1.5px solid var(--ink); }
.key { display: flex; flex-direction: column; gap: 4px; color: var(--ink-2); }
.key div { display: flex; align-items: center; gap: 8px; }
#clusters { max-height: 260px; overflow-y: auto; }
@media (max-width: 760px) {
  main { flex-direction: column; }
  #stage { min-height: 60vh; }
  aside { width: auto; border-left: 0; border-top: 1px solid var(--hairline); }
  header .controls { margin-left: 0; }
}
</style>
</head>
<body>
<header>
  <h1>Reply network</h1>
  <span class="summary" id="summary"></span>
  <div class="controls">
    <input id="search" list="ids" placeholder="Find C…" aria-label="Find a node by pseudonym" size="10">
    <datalist id="ids"></datalist>
    <button id="clear">Clear selection</button>
    <button id="reset">Reset view</button>
  </div>
</header>
<main>
  <div id="stage">
    <canvas id="canvas" aria-label="Force-directed reply network; use the lists at right for keyboard access"></canvas>
    <div id="tip"></div>
    <div id="status">Laying out…</div>
  </div>
  <aside>
    <h2>Selected</h2>
    <div id="card"><p class="empty">Click a node, a cluster, or a name below.</p></div>
    <h2>Key</h2>
    <div class="key">
      <div><span class="swatch" style="background:var(--series-1)"></span>Cluster 1 (largest)</div>
      <div><span class="swatch" style="background:var(--series-2)"></span>Cluster 2</div>
      <div><span class="swatch" style="background:var(--series-3)"></span>Cluster 3</div>
      <div><span class="swatch" style="background:var(--other)"></span>All other clusters</div>
      <div><span class="ring"></span>Moderator</div>
      <div>Size = number of connections</div>
    </div>
    <h2>Clusters (Louvain)</h2>
    <ul class="list" id="clusters"></ul>
    <h2>Most connected</h2>
    <ul class="list" id="top"></ul>
  </aside>
</main>
<script id="data" type="application/json">__DATA__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const data = JSON.parse(document.getElementById("data").textContent);
const nodes = data.nodes.map((d, i) => ({ ...d, index: i }));
const links = data.links.map(([s, t, w]) => ({ source: s, target: t, w }));
const clusterSize = new Map(data.clusters.map(c => [c.id, c.size]));
const neighbors = nodes.map(() => new Set());
for (const l of links) { neighbors[l.source].add(l.target); neighbors[l.target].add(l.source); }
const byId = new Map(nodes.map(n => [n.id, n]));

const maxDeg = d3.max(nodes, n => n.degree) || 1;
const radius = d3.scaleSqrt().domain([1, maxDeg]).range([2.5, 16]);
nodes.forEach(n => { n.r = radius(Math.max(1, n.degree)); });
const labelled = new Set(nodes.slice(0, 5).map(n => n.index));  // nodes are sorted by degree

let selected = null;      // node index
let selectedCluster = null;
let transform = d3.zoomIdentity;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const tip = document.getElementById("tip");
let width = 0, height = 0;

function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function fill(n, c) { return n.cluster <= 3 ? c["series-" + n.cluster] : c.other; }
function active(n) {
  if (selected !== null) return n.index === selected || neighbors[selected].has(n.index);
  if (selectedCluster !== null) return n.cluster === selectedCluster;
  return true;
}

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  width = rect.width; height = rect.height;
  canvas.width = width * dpr; canvas.height = height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function draw() {
  const c = { surface: css("--surface"), ink: css("--ink"), edge: css("--edge"), other: css("--other"),
              "series-1": css("--series-1"), "series-2": css("--series-2"), "series-3": css("--series-3") };
  const focus = selected !== null || selectedCluster !== null;
  ctx.save();
  ctx.clearRect(0, 0, width, height);
  ctx.translate(transform.x, transform.y);
  ctx.scale(transform.k, transform.k);

  ctx.lineWidth = 0.6 / transform.k;
  ctx.strokeStyle = c.edge;
  ctx.globalAlpha = focus ? 0.04 : 0.10;
  ctx.beginPath();
  for (const l of links) {
    if (focus && active(l.source) && active(l.target)) continue;
    ctx.moveTo(l.source.x, l.source.y); ctx.lineTo(l.target.x, l.target.y);
  }
  ctx.stroke();
  if (focus) {
    ctx.globalAlpha = 0.45;
    ctx.beginPath();
    for (const l of links) {
      if (!(active(l.source) && active(l.target))) continue;
      if (selected !== null && l.source.index !== selected && l.target.index !== selected) continue;
      ctx.moveTo(l.source.x, l.source.y); ctx.lineTo(l.target.x, l.target.y);
    }
    ctx.stroke();
  }

  // Small nodes first so hubs sit on top; each wears a surface ring. Radii are in
  // screen pixels, so zooming in spreads a dense region apart.
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    ctx.globalAlpha = active(n) ? 1 : 0.12;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r / transform.k, 0, 2 * Math.PI);
    ctx.fillStyle = fill(n, c);
    ctx.fill();
    ctx.lineWidth = 1 / transform.k;
    ctx.strokeStyle = c.surface;
    ctx.stroke();
    if (n.mod) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, (n.r + 2) / transform.k, 0, 2 * Math.PI);
      ctx.lineWidth = 1.5 / transform.k;
      ctx.strokeStyle = c.ink;
      ctx.stroke();
    }
  }

  ctx.globalAlpha = 1;
  ctx.fillStyle = c.ink;
  ctx.font = `${12 / transform.k}px system-ui, -apple-system, "Segoe UI", sans-serif`;
  const show = new Set(labelled);
  if (selected !== null) show.add(selected);
  for (const i of show) {
    const n = nodes[i];
    if (!active(n)) continue;
    ctx.fillText(n.id, n.x + (n.r + 4) / transform.k, n.y + 4 / transform.k);
  }
  ctx.restore();
}

function nodeAt(event) {
  const [mx, my] = d3.pointer(event, canvas);
  const [x, y] = transform.invert([mx, my]);
  let best = null, bestD = Infinity;
  for (const n of nodes) {
    const d = Math.hypot(n.x - x, n.y - y) * transform.k - n.r;  // screen px past the mark
    if (d < bestD) { bestD = d; best = n; }
  }
  return bestD <= 10 ? best : null;  // 10px of slack beyond the mark
}

function row(dl, label, value) {
  const dt = document.createElement("dt"); dt.textContent = label;
  const dd = document.createElement("dd"); dd.textContent = value;
  dl.append(dt, dd);
}

function showCard() {
  const card = document.getElementById("card");
  card.replaceChildren();
  if (selected !== null) {
    const n = nodes[selected];
    const h = document.createElement("p");
    h.style.margin = "0 0 6px"; h.style.fontWeight = "600"; h.textContent = n.id;
    const dl = document.createElement("dl");
    row(dl, "Connections (people)", n.degree.toLocaleString());
    row(dl, "Replied to by (people)", n.replied_by.toLocaleString());
    row(dl, "Replied to (people)", n.replied_to.toLocaleString());
    row(dl, "Thread contexts", n.contexts.toLocaleString());
    row(dl, "Cluster", `${n.cluster} (${clusterSize.get(n.cluster).toLocaleString()} people)`);
    row(dl, "Moderator", n.mod ? "yes" : "no");
    card.append(h, dl);
  } else if (selectedCluster !== null) {
    const members = nodes.filter(n => n.cluster === selectedCluster);
    const dl = document.createElement("dl");
    row(dl, "Cluster", String(selectedCluster));
    row(dl, "People", members.length.toLocaleString());
    row(dl, "Moderators", members.filter(n => n.mod).length.toLocaleString());
    row(dl, "Most connected", members[0].id);
    card.append(dl);
  } else {
    const p = document.createElement("p");
    p.className = "empty"; p.textContent = "Click a node, a cluster, or a name below.";
    card.append(p);
  }
  for (const b of document.querySelectorAll("#clusters button"))
    b.setAttribute("aria-pressed", String(Number(b.dataset.id) === selectedCluster));
}

function select(i) { selected = i; selectedCluster = null; showCard(); draw(); }
function selectCluster(id) { selectedCluster = id; selected = null; showCard(); draw(); }

function centerOn(n) {
  userMoved = true;
  const k = Math.max(transform.k, 1.5);
  d3.select(canvas).call(zoom.transform,
    d3.zoomIdentity.translate(width / 2 - n.x * k, height / 2 - n.y * k).scale(k));
}

function fit() {
  if (!width) return;
  const xs = d3.extent(nodes, n => n.x), ys = d3.extent(nodes, n => n.y);
  const k = 0.9 * Math.min(width / (xs[1] - xs[0] || 1), height / (ys[1] - ys[0] || 1));
  const t = d3.zoomIdentity.translate(width / 2 - k * (xs[0] + xs[1]) / 2,
                                      height / 2 - k * (ys[0] + ys[1]) / 2).scale(k);
  d3.select(canvas).call(zoom.transform, t);
}

// Lists: the keyboard and table route to everything the canvas shows.
const colorVar = id => id <= 3 ? `var(--series-${id})` : "var(--other)";
const clusterList = document.getElementById("clusters");
for (const cl of data.clusters) {
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.dataset.id = cl.id;
  const sw = document.createElement("span"); sw.className = "swatch"; sw.style.background = colorVar(cl.id);
  const name = document.createElement("span"); name.textContent = `Cluster ${cl.id}`;
  const n = document.createElement("span"); n.className = "n"; n.textContent = cl.size.toLocaleString();
  b.append(sw, name, n);
  b.addEventListener("click", () => selectCluster(selectedCluster === cl.id ? null : cl.id));
  li.append(b); clusterList.append(li);
}
const topList = document.getElementById("top");
for (const node of nodes.slice(0, 25)) {
  const li = document.createElement("li");
  const b = document.createElement("button");
  const sw = document.createElement("span");
  sw.className = node.mod ? "swatch ring" : "swatch";
  sw.style.background = colorVar(node.cluster);
  const name = document.createElement("span"); name.textContent = node.id;
  const n = document.createElement("span"); n.className = "n"; n.textContent = node.degree.toLocaleString();
  b.append(sw, name, n);
  b.addEventListener("click", () => { select(node.index); centerOn(node); });
  li.append(b); topList.append(li);
}
const datalist = document.getElementById("ids");
for (const node of nodes) { const o = document.createElement("option"); o.value = node.id; datalist.append(o); }

document.getElementById("summary").textContent =
  `${nodes.length.toLocaleString()} people · ${links.length.toLocaleString()} ties · ` +
  `${data.clusters.length.toLocaleString()} clusters · weight: ${data.meta.weight}`;

document.getElementById("search").addEventListener("change", e => {
  const n = byId.get(e.target.value.trim());
  if (n) { select(n.index); centerOn(n); }
});
document.getElementById("clear").addEventListener("click", () => { selected = null; selectedCluster = null; showCard(); draw(); });
document.getElementById("reset").addEventListener("click", () => { userMoved = false; fit(); });

const zoom = d3.zoom().scaleExtent([0.02, 40]).on("zoom", e => {
  transform = e.transform;
  if (e.sourceEvent) userMoved = true;
  draw();
});
d3.select(canvas).call(zoom).on("dblclick.zoom", null);

canvas.addEventListener("click", e => {
  const n = nodeAt(e);
  if (n) select(selected === n.index ? null : n.index);
});
canvas.addEventListener("pointermove", e => {
  const n = nodeAt(e);
  if (!n) { tip.style.display = "none"; return; }
  tip.replaceChildren();
  const v = document.createElement("strong"); v.textContent = n.degree.toLocaleString();
  const s = document.createElement("span"); s.textContent = ` connections · ${n.id} · cluster ${n.cluster}${n.mod ? " · mod" : ""}`;
  tip.append(v, s);
  const [mx, my] = d3.pointer(e, canvas);
  tip.style.left = `${mx + 14}px`; tip.style.top = `${my + 14}px`;
  tip.style.display = "block";
});
canvas.addEventListener("pointerleave", () => { tip.style.display = "none"; });

// Layout runs in chunks of ticks between frames, so the page stays responsive and
// the view keeps itself fitted until the reader zooms or pans.
const status = document.getElementById("status");
const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).distance(30))
  .force("charge", d3.forceManyBody().strength(-30).distanceMax(600))
  .force("x", d3.forceX().strength(0.03))
  .force("y", d3.forceY().strength(0.03))
  .alphaDecay(0.03)
  .stop();
let userMoved = false;
function step() {
  for (let i = 0; i < 10 && sim.alpha() > sim.alphaMin(); i++) sim.tick();
  if (!userMoved) fit(); else draw();
  if (sim.alpha() > sim.alphaMin()) setTimeout(step, 0);
  else {
    status.textContent = "Layout settled. Scroll to zoom, drag to pan, click a node.";
    const n = byId.get(decodeURIComponent(location.hash.slice(1)));  // e.g. network.html#C12
    if (n) select(n.index);
  }
}

new ResizeObserver(resize).observe(document.getElementById("stage"));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
setTimeout(step, 0);
</script>
</body>
</html>
